<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAM工作台</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    background: #f5f6f8;
    color: #1e293b;
    min-height: 100vh;
  }
  .app { max-width: 100%; margin: 0 auto; padding: 16px 20px 40px; }

  /* 顶部 */
  .header { margin-bottom: 16px; }
  .header h1 {
    font-size: 20px; font-weight: 700; color: #1e293b;
    display: flex; align-items: center; gap: 8px; letter-spacing: -0.3px;
  }
  .header-row {
    display: flex; align-items: center; justify-content: space-between;
  }
  .header-row p { font-size: 13px; color: #8896a6; }

  /* 语言切换 */
  .lang-btn {
    padding: 4px 12px; font-size: 13px; font-weight: 500;
    border: 1.5px solid #d0d8e4; border-radius: 8px;
    background: #fff; cursor: pointer; color: #4a5a70;
    transition: .15s; white-space: nowrap;
  }
  .lang-btn:hover { border-color: #4a7cf7; color: #4a7cf7; }
  .lang-btn.active { background: #4a7cf7; color: #fff; border-color: #4a7cf7; }

  /* 搜索栏 */
  .search-box {
    display: flex; gap: 8px; margin-bottom: 12px;
  }
  .search-box input {
    flex: 1; padding: 10px 16px; font-size: 14px;
    border: 1px solid #dde1e7; border-radius: 10px;
    outline: none; background: #fff; transition: .2s;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .search-box input:focus {
    border-color: #4a7cf7;
    box-shadow: 0 0 0 3px rgba(74,124,247,0.08);
  }
  .search-box button {
    padding: 0 20px; font-size: 13px; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    transition: .15s; white-space: nowrap;
  }
  .btn-search {
    background: #1e293b; color: #fff;
  }
  .btn-search:hover { background: #334155; }
  .btn-search:disabled { opacity: .4; cursor: not-allowed; }
  .btn-batch-mode {
    padding: 0 14px; font-size: 13px; font-weight: 500;
    border: 1px solid #dde1e7; border-radius: 10px;
    background: #fff; cursor: pointer; transition: .15s; white-space: nowrap;
    color: #64748b; box-shadow: 0 1px 2px rgba(0,0,0,.03);
  }
  .btn-batch-mode:hover { border-color: #1e293b; color: #1e293b; }
  .btn-batch-mode.active { background: #1e293b; color: #fff; border-color: #1e293b; }

  /* 批量查询面板 */
  .batch-panel {
    background: #fff; border: 1.5px solid #4a7cf7;
    border-radius: 12px; padding: 14px 16px;
    margin-bottom: 16px; display: none;
  }
  .batch-panel textarea {
    width: 100%; min-height: 80px; max-height: 200px;
    padding: 10px 12px; font-size: 14px; font-family: "SF Mono", "Menlo", monospace;
    border: 1.5px solid #d0d8e4; border-radius: 8px;
    outline: none; resize: vertical; transition: .2s;
    background: #fff; color: #1a2332;
  }
  .batch-panel textarea:focus {
    border-color: #4a7cf7;
    box-shadow: 0 0 0 3px rgba(74,124,247,0.12);
  }
  .batch-panel .batch-info {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px; gap: 8px;
  }
  .batch-panel .batch-info .hint {
    font-size: 12px; color: #9aabb8;
  }
  .btn-batch-cancel {
    background: transparent; color: #6b7a90;
    border: 1px solid #d0d8e4 !important;
  }
  .btn-batch-cancel:hover { border-color: #9aabb8; }

  /* 批量进度 */
  .batch-progress {
    display: none; margin-bottom: 12px;
  }
  .batch-progress-bar {
    height: 4px; background: #e0e6ee; border-radius: 2px;
    overflow: hidden; margin-bottom: 6px;
  }
  .batch-progress-bar .fill {
    height: 100%; width: 0%; background: #4a7cf7;
    border-radius: 2px; transition: width .3s;
  }
  .batch-progress-text {
    font-size: 12px; color: #6b7a90;
  }
  .batch-progress-text .count-done { color: #4a7cf7; font-weight: 600; }
  .batch-progress-text .count-fail { color: #e53935; }
  .batch-progress-text .count-total { color: #1a2332; font-weight: 600; }

  /* ====== 主布局：侧边栏 + 内容 ====== */
  .main-area { display: flex; gap: 0; align-items: stretch; }

  /* 拖拽分隔条 */
  .resizer {
    width: 8px; cursor: col-resize; flex-shrink: 0;
    background: #e8ecf2; position: relative; z-index: 10;
    border-radius: 4px; margin: 0 2px;
    align-self: stretch; min-height: 400px;
  }
  .resizer:hover, .resizer.active { background: #4a7cf7; box-shadow: 0 0 4px rgba(74,124,247,.3); }

  /* ====== 侧边栏 ====== */
  .sidebar {
    width: 250px; flex-shrink: 0; position: sticky; top: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .sidebar-section {
    background: #fff; border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    overflow: hidden; border: 1px solid #eef1f5;
  }
  .sidebar-section-title {
    font-size: 12px; font-weight: 700; color: #475569;
    padding: 9px 14px; border-bottom: 1px solid #f1f3f6;
    background: #fafbfc; user-select: none;
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar-section-title .title-text { cursor: pointer; }
  .sidebar-section-title .title-text:hover { color: #4a7cf7; text-decoration: underline dashed; }
  .sidebar-section-title .title-edit-input {
    font-size: 13px; font-weight: 600; padding: 2px 6px;
    border: 1.5px solid #4a7cf7; border-radius: 6px;
    outline: none; width: 120px; background: #fff; color: #1a2332;
  }

  /* 拖拽排序 */
  .drag-handle { cursor: grab; color: #c8d0d8; font-size: 14px; padding: 2px 4px; }
  .drag-handle:hover { color: #6b7a90; }
  .drag-handle:active { cursor: grabbing; }
  .sort-btn { padding: 2px 4px; font-size: 11px; border: none; background: transparent; cursor: pointer; color: #c8d0d8; }
  .sort-btn:hover { color: #6b7a90; }
  .sidebar-section-title .collapse-icon {
    font-size: 10px; transition: .2s; margin-left: auto;
  }
  .sidebar-section-title .collapse-icon.open { transform: rotate(180deg); }
  .sidebar-section-body { padding: 10px 14px; }
  .sidebar-section-body.hidden { display: none; }

  /* 备忘录 */
  .memo-list { list-style: none; }
  .memo-row {
    display: flex; align-items: flex-start; gap: 6px;
    margin-bottom: 4px;
  }
  .memo-num {
    font-size: 12px; color: #9aabb8; font-weight: 500; width: 18px;
    text-align: right; padding-top: 7px; flex-shrink: 0;
  }
  .memo-input {
    flex: 1; padding: 6px 8px; font-size: 13px; line-height: 1.5;
    border: 1px solid transparent; border-radius: 6px;
    outline: none; background: transparent; color: #2a3a4a;
    transition: .15s; font-family: inherit;
  }
  .memo-input:hover { background: #f5f6f8; }
  .memo-input:focus { background: #fff; border-color: #4a7cf7; }
  .memo-input::placeholder { color: #c8d0d8; }
  .memo-del {
    padding: 4px 6px; font-size: 11px; border: none; background: transparent;
    cursor: pointer; color: #d0c8c8; flex-shrink: 0; margin-top: 3px;
    visibility: hidden; border-radius: 4px;
  }
  .memo-row:hover .memo-del { visibility: visible; }
  .memo-del:hover { color: #e53935; background: #fce4ec; }
  .memo-saved { font-size: 10px; color: #9aabb8; text-align: right; margin-top: 4px; }

  /* 模板 */
  .template-item {
    display: block; width: 100%; text-align: left;
    padding: 7px 10px; font-size: 12px;
    border: 1px solid #e8ecf2; border-radius: 7px;
    background: #fafbfc; cursor: pointer; margin-bottom: 5px;
    transition: .15s; color: #4a5a70; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis;
  }
  .template-item:hover { border-color: #4a7cf7; color: #4a7cf7; background: #f5f7ff; }
  .template-item:last-child { margin-bottom: 0; }
  .template-item.copied { border-color: #43a047; color: #2e7d32; background: #e8f5e9; }
  .tpl-label {
    font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px;
    background: #e8ecf2; color: #5a6a80; white-space: nowrap; flex-shrink: 0;
    cursor: pointer; min-width: 28px; text-align: center;
  }
  .tpl-label:hover { background: #d0d8e4; }

  /* 快捷链接 */
  .link-item {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px; font-size: 12px; border-radius: 7px;
    color: #4a5a70; text-decoration: none; transition: .15s;
    border: 1px solid transparent; cursor: pointer;
  }
  .link-item:hover { background: #f5f7ff; border-color: #d0d8e4; color: #4a7cf7; }
  .link-item .link-icon { font-size: 14px; flex-shrink: 0; }

  /* 偏远查询 */
  .remote-form { display: flex; flex-direction: column; gap: 6px; }
  .remote-form select, .remote-form input {
    width: 100%; padding: 6px 8px; font-size: 12px;
    border: 1px solid #d0d8e4; border-radius: 7px;
    outline: none; background: #fff; color: #2a3a4a;
  }
  .remote-form select:focus, .remote-form input:focus { border-color: #4a7cf7; }
  .remote-btn {
    width: 100%; padding: 7px; font-size: 13px; font-weight: 500;
    border: none; border-radius: 8px; cursor: pointer;
    background: #4a7cf7; color: #fff; transition: .15s;
  }
  .remote-btn:hover { background: #3a6ae0; }
  .remote-btn:disabled { opacity: .5; cursor: not-allowed; }
  .remote-result {
    margin-top: 6px; padding: 8px 10px; border-radius: 8px;
    font-size: 13px; font-weight: 600; text-align: center;
  }
  .remote-result.far { background: #fce4ec; color: #c62828; }
  .remote-result.not-far { background: #e8f5e9; color: #2e7d32; }
  .remote-result.error { background: #fff3e0; color: #e65100; }

  /* ====== 顶部控制栏 ====== */
  .control-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .stats-row {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .stat-pill {
    font-size: 12px; font-weight: 600; padding: 3px 10px;
    border-radius: 12px; white-space: nowrap;
    cursor: pointer; transition: .15s; border: 1px solid transparent;
    user-select: none;
  }
  .stat-pill:hover { opacity: .85; }
  .stat-pill.active { border-color: #1e293b; box-shadow: 0 0 0 1px rgba(0,0,0,.05); }
  .stat-pill.arriving { background: #fef9e7; color: #b7950b; }
  .stat-pill.in_transit { background: #e8f0fe; color: #1a56c4; }
  .stat-pill.pending { background: #f3eef9; color: #6b3fa0; }
  .stat-pill.completed { background: #eaf5ea; color: #1e7d2e; }
  .stat-pill.fail { background: #fdecec; color: #b91c1c; }
  .stat-pill.all { background: #f1f2f5; color: #475569; }

  .filter-group {
    display: flex; align-items: center; gap: 6px; margin-left: auto;
  }
  .filter-input {
    padding: 6px 12px; font-size: 13px;
    border: 1.5px solid #d0d8e4; border-radius: 8px;
    outline: none; width: 130px; transition: .2s; background: #fff;
  }
  .filter-input:focus { border-color: #4a7cf7; }
  .filter-input::placeholder { color: #b0bcc8; }

  .btn-export {
    padding: 6px 14px; font-size: 12px; font-weight: 500;
    border: 1px solid #d0d8e4; border-radius: 8px;
    background: #fff; cursor: pointer; transition: .15s;
    color: #4a5a70; white-space: nowrap;
  }
  .btn-export:hover { border-color: #4a7cf7; color: #4a7cf7; }

  .pin-badge {
    font-size: 12px; color: #f57f17; background: #fff8e1;
    padding: 2px 8px; border-radius: 10px; white-space: nowrap;
  }

  /* ====== 左右分栏 ====== */
  .split-layout {
    display: flex; gap: 0; align-items: stretch;
  }
  .split-layout .panel { flex: 1; min-width: 200px; }

  .panel {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 2px rgba(0,0,0,.03);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 200px;
    border: 1px solid #eef1f5;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid #f1f3f6;
    background: #fafbfc;
    font-size: 13px;
    font-weight: 700;
    color: #1e293b;
    flex-shrink: 0;
  }
  .panel-header .panel-count {
    font-size: 12px;
    font-weight: 500;
    background: #e8ecf2;
    color: #5a6a80;
    padding: 2px 10px;
    border-radius: 12px;
    min-width: 24px;
    text-align: center;
  }
  .panel-header .panel-actions {
    margin-left: auto;
    display: flex; gap: 6px;
  }
  .panel-header .panel-actions button {
    padding: 5px 12px; font-size: 12px;
    border: 1px solid #d0d8e4; border-radius: 7px;
    background: #fff; cursor: pointer; transition: .15s;
    color: #4a5a70; white-space: nowrap;
  }
  .panel-header .panel-actions button:hover {
    border-color: #4a7cf7; color: #4a7cf7;
  }
  .panel-header .panel-actions button:disabled {
    opacity: .4; cursor: not-allowed;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    max-height: calc(100vh - 300px);
    padding: 6px 8px 10px;
  }

  .panel-empty {
    text-align: center;
    padding: 50px 20px;
    color: #9aabb8;
    font-size: 14px;
  }

  /* ====== 卡片 ====== */
  .card {
    background: #fff;
    border: 1px solid #eef1f5;
    border-radius: 8px;
    margin-bottom: 6px;
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s;
  }
  .card:hover { border-color: #dce0e8; box-shadow: 0 1px 6px rgba(0,0,0,.04); }

  /* 快到港 0-1天高亮 — 红色预警 */
  .card.urgent {
    border-left: 4px solid #e53935;
    background: #fff5f5;
  }
  .card.urgent:hover { border-color: #ef9a9a; }

  /* 快到港 2-3天高亮 — 橙色提醒 */
  .card.warning {
    border-left: 4px solid #f57c00;
    background: #fffdf7;
  }
  .card.warning:hover { border-color: #ffcc02; }

  /* 搜索高亮闪烁 */
  .card.highlight-flash {
    animation: highlightPulse 0.6s ease-in-out 3;
    border-color: #4a7cf7 !important;
    box-shadow: 0 0 0 3px rgba(74,124,247,0.2) !important;
  }
  @keyframes highlightPulse {
    0%, 100% { background: #fff; }
    50% { background: #e8f0ff; }
  }

  .card-header {
    display: flex; flex-direction: column; gap: 6px;
    padding: 12px 14px; cursor: pointer;
  }
  .card-header-row {
    display: flex; align-items: center; gap: 8px;
    flex-wrap: nowrap; overflow: hidden;
  }
  .card-header-row.main { }
  .card-header-row.sub {
    font-size: 12px; color: #6b7a90; gap: 10px;
  }
  .card-header .no {
    font-size: 13px; font-weight: 700; color: #1e293b;
    font-family: "SF Mono", "Menlo", "Cascadia Code", monospace;
    white-space: nowrap; flex-shrink: 0;
  }
  .card-header .status-tag {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    font-weight: 600; white-space: nowrap; flex-shrink: 0;
    letter-spacing: 0.2px;
  }
  .status-tag.arriving { background: #fef9e7; color: #b7950b; }
  .status-tag.in_transit { background: #e8f0fe; color: #1a56c4; }
  .status-tag.completed { background: #eaf5ea; color: #1e7d2e; }
  .status-tag.fail { background: #fdecec; color: #b91c1c; }
  .status-tag.pending { background: #f3eef9; color: #6b3fa0; }

  .card-header .meta {
    font-size: 11px; color: #9aabb8;
    display: flex; align-items: center; gap: 8px;
    flex-shrink: 0; white-space: nowrap;
  }
  .card-header .days-left {
    font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 12px;
    white-space: nowrap;
  }
  .days-left.urgent { background: #ffebee; color: #c62828; }
  .days-left.warning { background: #fff3e0; color: #e65100; }

  /* 客户备注 */
  .card-note {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; color: #6b7a90; background: #f5f6f8;
    padding: 2px 8px; border-radius: 6px;
    max-width: 100px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-note:hover { border-color: #4a7cf7; background: #eef2ff; }
  .card-note.empty { color: #b0bcc8; font-style: italic; }
  .card-note-input {
    font-size: 12px; padding: 2px 6px; border: 1.5px solid #4a7cf7;
    border-radius: 6px; outline: none; width: 90px;
    background: #fff; color: #1a2332;
    box-shadow: 0 0 0 2px rgba(74,124,247,0.15);
  }

  /* 业务员标签 */
  .card-sp {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; color: #5a7a60; background: #eef7ef;
    padding: 2px 8px; border-radius: 6px;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-sp:hover { border-color: #43a047; background: #e0f2e1; }
  .card-sp.empty { color: #a0b8a4; font-style: italic; }

  /* 配合商标签 */
  .card-supplier {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; color: #a0522d; background: #fef5ee;
    padding: 2px 8px; border-radius: 6px;
    max-width: 90px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-supplier:hover { border-color: #e67e22; background: #fdf0e0; }
  .card-supplier.empty { color: #c0a890; font-style: italic; }

  /* 上家单号 */
  .card-supplier-no {
    font-size: 11px; font-family: "SF Mono", "Menlo", monospace;
    color: #8b7355; background: transparent;
    padding: 1px 6px; border-radius: 4px;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-supplier-no:hover { border-color: #a09080; background: #fdfaf5; }
  .card-supplier-no.empty { color: #c8c0b8; font-style: italic; }

  /* 仓库标签 */
  .card-warehouse {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 12px; color: #6a5acd; background: #f5f0ff;
    padding: 2px 8px; border-radius: 6px;
    max-width: 100px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-warehouse:hover { border-color: #7c6aef; background: #ede4ff; }
  .card-warehouse.empty { color: #b0a8d0; font-style: italic; }

  /* 群名标签 */
  .card-group {
    display: inline-flex; align-items: center; gap: 3px;
    font-size: 11px; color: #0d7a6e; background: #e6f7f4;
    padding: 2px 7px; border-radius: 6px;
    max-width: 110px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; cursor: pointer; transition: .15s;
    border: 1px dashed transparent;
    flex-shrink: 0;
  }
  .card-group:hover { border-color: #10b981; background: #d1fae5; }
  .card-group.empty { color: #a0c8c0; font-style: italic; }

  .card-header .arrow {
    transition: transform .2s; font-size: 12px; color: #9aabb8;
    flex-shrink: 0;
  }
  .card-header .arrow.open { transform: rotate(180deg); }

  /* 卡片操作按钮 */
  .card-actions {
    display: flex; gap: 4px; align-items: center;
  }
  .card-actions button {
    padding: 3px 8px; font-size: 11px;
    border: 1px solid #e0e6ee; border-radius: 6px;
    background: #fff; cursor: pointer; color: #5a6a80; transition: .1s;
  }
  .card-actions button:hover { border-color: #4a7cf7; color: #4a7cf7; }
  .card-actions .btn-del:hover { border-color: #e53935; color: #e53935; }
  .card-actions .btn-pin { color: #ccc; font-size: 13px; }
  .card-actions .btn-pin:hover { border-color: #f57c00; color: #f57c00; }
  .card-actions .btn-pin.pinned { color: #f57c00; border-color: #ffcc80; }
  .card-actions button:disabled { opacity: .4; cursor: not-allowed; }

  /* 置顶卡片 */
  .card.pinned { border-left: 3px solid #f57c00; }

  /* 时效标签 */
  .transit-tag {
    font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 8px;
    white-space: nowrap; display: inline-flex; align-items: center; gap: 3px;
  }
  .transit-tag.done { background: #eaf5ea; color: #1e7d2e; }
  .transit-tag.active { background: #e8f0fe; color: #1a56c4; }
  .transit-range { font-size: 10px; opacity: .65; font-weight: 400; }

  /* 卡片正文 */
  .card-body { padding: 0 14px 0; display: none; }
  .card-body.open { display: block; padding: 0 14px 14px; }

  .brief-status {
    font-size: 12px; color: #5a6a80;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    max-width: 320px; flex-shrink: 1;
  }

  .event-list { list-style: none; position: relative; }
  .event-list::before {
    content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
    width: 2px; background: #e0e6ee;
  }
  .event-item {
    display: flex; gap: 10px; padding: 5px 0;
    position: relative; align-items: flex-start;
  }
  .event-dot {
    width: 14px; height: 14px; flex-shrink: 0;
    border-radius: 50%; background: #d0d8e4; margin-top: 2px;
    position: relative; z-index: 1;
  }
  .event-item:first-child .event-dot {
    background: #4a7cf7; box-shadow: 0 0 0 3px rgba(74,124,247,.2);
  }
  .event-item:first-child .event-content { font-weight: 500; }
  .event-content { flex: 1; font-size: 13px; line-height: 1.5; color: #2a3a4a; }
  .event-time { font-size: 11px; color: #9aabb8; white-space: nowrap; margin-top: 1px; }

  .no-events { color: #9aabb8; font-size: 13px; padding: 10px 0; text-align: center; }

  /* toast */
  .toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
    background: #1a2332; color: #fff; padding: 10px 24px; border-radius: 8px;
    font-size: 14px; opacity: 0; transition: .3s; pointer-events: none;
    white-space: nowrap; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 响应式：窄屏隐藏侧边栏 */
  @media (max-width: 1100px) {
    .sidebar { display: none; }
  }

  /* 平板 */
  @media (max-width: 900px) {
    .app { padding: 12px 12px 40px; }
    .split-layout { flex-direction: column; }
    .split-layout .panel { min-width: 0 !important; }
    .panel-body { max-height: none; }
    .split-layout .resizer { display: none; }
    #resizerSidebar { display: none; }
    .card-header { padding: 10px 12px; }
    .card-header-row.sub { flex-wrap: wrap; }
    .brief-status { max-width: 180px; font-size: 11px; }
    .card-header .no { font-size: 13px; }
    .control-bar { flex-wrap: wrap; gap: 8px; }
  }

  /* 手机 */
  @media (max-width: 600px) {
    .app { padding: 8px 8px 30px; }
    .header h1 { font-size: 17px; }
    .header-row p { font-size: 11px; display: none; }
    .search-box input { font-size: 13px; padding: 9px 12px; }
    .search-box button { padding: 0 14px; font-size: 12px; }
    .btn-batch-mode { font-size: 12px; padding: 0 10px; }
    .card-header { padding: 8px 10px; }
    .card-header .no { font-size: 12px; }
    .card-header-row.main { gap: 4px; flex-wrap: wrap; }
    .card-header-row.sub { font-size: 11px; gap: 4px; }
    .card-note, .card-sp, .card-supplier, .card-warehouse { font-size: 10px; padding: 1px 6px; max-width: 60px; }
    .status-tag { font-size: 9px; padding: 1px 6px; }
    .panel-header { font-size: 12px; padding: 8px 10px; }
    .panel-body { padding: 4px 6px 6px; }
    .card { margin-bottom: 4px; }
    .brief-status { max-width: 100px; font-size: 10px; }
    .stat-pill { font-size: 10px; padding: 2px 7px; }
    .btn-export, .btn-backup { font-size: 10px; padding: 4px 8px; }
    .days-left { font-size: 10px !important; }
    .transit-tag { font-size: 10px; }
    #todayExpandStub { font-size: 10px; }
  }

<script>
const inputNo = document.getElementById('inputNo');
const btnSearch = document.getElementById('btnSearch');
const listAll = document.getElementById('listAll');
const listToday = document.getElementById('listToday');
const emptyAll = document.getElementById('emptyAll');
const emptyToday = document.getElementById('emptyToday');
const countAll = document.getElementById('countAll');
const countToday = document.getElementById('countToday');
const btnRefreshActive = document.getElementById('btnRefreshActive');
const btnRefreshToday = document.getElementById('btnRefreshToday');
const toast = document.getElementById('toast');
const langToggle = document.getElementById('langToggle');
const subtitle = document.getElementById('subtitle');
const panelAllTitle = document.getElementById('panelAllTitle');
const panelTodayTitle = document.getElementById('panelTodayTitle');
const batchPanel = document.getElementById('batchPanel');
const batchTextarea = document.getElementById('batchTextarea');
const batchHint = document.getElementById('batchHint');
const btnBatchSearch = document.getElementById('btnBatchSearch');
const btnBatchCancel = document.getElementById('btnBatchCancel');
const btnBatchMode = document.getElementById('btnBatchMode');
const batchProgress = document.getElementById('batchProgress');
const batchProgressFill = document.getElementById('batchProgressFill');
const batchDone = document.getElementById('batchDone');
const batchTotal = document.getElementById('batchTotal');
const batchFail = document.getElementById('batchFail');

let currentLang = localStorage.getItem('tracking_lang') || 'zh';
let batchNumbers = [];
let batchRunning = false;
let searchHighlightTimer = null;

// ---- 国际化 ----
function t(zh, en) {
  return currentLang === 'en' ? en : zh;
}

function updateLangUI() {
  langToggle.textContent = currentLang === 'zh' ? 'EN' : '中文';
  langToggle.classList.toggle('active', currentLang === 'en');
  subtitle.textContent = t('货代全流程管理 · 轨迹跟踪 · 仓库速查 · 偏远查询', 'Freight Management · Tracking · Warehouse · Remote Area');
  inputNo.placeholder = t('输入运单号，回车查询', 'Enter waybill No. & press Enter');
  btnSearch.textContent = t('查询', 'Track');
  panelAllTitle.textContent = t('全部历史', 'All History');
  panelTodayTitle.textContent = t('今日查询', 'Today');
  document.getElementById('emptyAll').textContent = t('暂无跟踪记录，输入运单号开始查询', 'No records yet. Enter a waybill to start.');
  document.getElementById('emptyToday').textContent = t('今天还没有查询记录', 'No queries today yet');
  btnRefreshActive.textContent = t('🔄 刷新进行中', '🔄 Refresh Active');
  btnRefreshToday.textContent = t('🔄 刷新', '🔄 Refresh');
  btnBatchSearch.textContent = t('批量查询', 'Batch query');
  btnBatchCancel.textContent = t('取消', 'Cancel');
  btnBatchMode.textContent = t('📋 批量', '📋 Batch');
  batchTextarea.placeholder = t('粘贴多个运单号，支持换行、逗号、分号分隔', 'Paste waybill numbers, separated by new line, comma or semicolon');
  updateBatchBtn();
}

function toggleLang() {
  currentLang = currentLang === 'zh' ? 'en' : 'zh';
  localStorage.setItem('tracking_lang', currentLang);
  updateLangUI();
  render();
}

// ---- Toast ----
let toastTimer;
function showToast(msg, isError) {
  toast.textContent = msg;
  toast.style.background = isError ? '#c62828' : '#1a2332';
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
}

// ---- 批量查询 ----
function parseBatchInput(text) {
  const parts = text.split(/[\n,，;；、\s]+/).map(s => s.trim()).filter(Boolean);
  return [...new Set(parts)];
}

function updateBatchBtn() {
  const text = batchTextarea.value.trim();
  const numbers = text ? parseBatchInput(text) : [];
  batchHint.textContent = t(`检测到 ${numbers.length} 个单号`, `${numbers.length} number(s) detected`);
  btnBatchSearch.disabled = numbers.length < 2;
  if (numbers.length >= 2) {
    btnBatchSearch.textContent = t(`批量查询 ${numbers.length} 票`, `Batch (${numbers.length})`);
  } else {
    btnBatchSearch.textContent = t('批量查询', 'Batch query');
  }
  return numbers;
}

function toggleBatchMode(show) {
  if (show === undefined) show = batchPanel.style.display !== 'block';
  batchPanel.style.display = show ? 'block' : 'none';
  btnBatchMode.classList.toggle('active', show);
  if (show) {
    batchTextarea.focus();
    batchTextarea.value = '';
    batchProgress.style.display = 'none';
    updateBatchBtn();
  } else {
    batchTextarea.value = '';
  }
}

async function doBatchSearch() {
  const text = batchTextarea.value.trim();
  const numbers = parseBatchInput(text);
  if (numbers.length < 2) {
    showToast(t('请至少输入 2 个单号', 'Enter at least 2 numbers'), true);
    return;
  }
  if (batchRunning) return;
  batchRunning = true;
  btnBatchSearch.disabled = true;
  btnBatchSearch.textContent = t('查询中...', 'Querying...');
  batchProgress.style.display = 'block';
  batchTextarea.disabled = true;

  let done = 0, failed = 0;
  const total = numbers.length;
  batchDone.textContent = '0';
  batchTotal.textContent = total;
  batchFail.textContent = '';
  batchProgressFill.style.width = '0%';

  for (const no of numbers) {
    try {
      const result = await trackQuery(no);
      if (result.result === false) failed++;
    } catch { failed++; }
    done++;
    batchDone.textContent = done;
    batchProgressFill.style.width = `${(done / total) * 100}%`;
    if (failed > 0) {
      batchFail.textContent = t(` ${failed} 失败`, ` ${failed} failed`);
    }
  }

  batchRunning = false;
  batchTextarea.disabled = false;
  toggleBatchMode(false);
  render();

  if (failed === 0) {
    showToast(t(`✅ ${total} 票全部查询成功`, `✅ ${total} shipment(s) tracked`));
  } else {
    showToast(t(`✅ 完成，${failed} 票查询失败`, `✅ Done, ${failed} shipment(s) failed`), true);
  }
}

// ---- 状态与渲染（引用共享模块）----
const { getLatestEvent, calcStatus, statusLabel, extractEstimatedDate } = window.StatusCalculator;

function eventContent(ev) {
  if (!ev) return '';
  if (currentLang === 'en') return ev.content_en || ev.content_loc || ev.content || '';
  return ev.content || ev.content_loc || '';
}

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => n.toString().padStart(2, '0');
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateShort(d) {
  if (!d || isNaN(d.getTime())) return '';
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function formatEventTime(t) {
  if (!t) return '';
  if (typeof t === 'string' && t.startsWith('/Date(')) {
    const ms = parseInt(t.match(/\d+/)[0]);
    return formatTime(new Date(ms).toISOString());
  }
  return formatTime(t);
}

// ---- 全程时效 ----
function getTransitInfo(item) {
  const events = (item.result && item.result.dataDict && item.result.dataDict.list) || [];
  if (events.length === 0) return null;

  // 事件按 id 升序排列：id 越大越早，id=1 最新
  const sorted = [...events].sort((a, b) => (a.id || 0) - (b.id || 0));
  const first = sorted[0];   // id=1，最新事件
  const last = sorted[sorted.length - 1]; // 最大 id，最早事件

  const startDate = new Date(last.created);
  const endDate = new Date(first.created);
  const now = new Date();

  if (isNaN(startDate.getTime())) return null;

  const status = calcStatus(item.result);
  const isCompleted = status === 'completed';

  // 已完成：最早 → 完成事件；进行中：最早 → 今天
  const end = isCompleted ? endDate : now;
  const totalDays = Math.ceil((end.getTime() - startDate.getTime()) / (1000 * 60 * 60 * 24));

  return {
    totalDays,
    startDate,
    endDate: isCompleted ? endDate : null,
    isCompleted,
    startStr: formatDateShort(startDate),
    endStr: isCompleted ? formatDateShort(endDate) : null,
  };
}

// ---- 剩余天数计算 ----
function getDaysRemaining(item) {
  const ev = getLatestEvent(item.result);
  if (!ev) return null;
  const content = ev.content || ev.content_loc || ev.content_en || '';
  const eta = extractEstimatedDate(content);
  if (!eta) return null;
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const diff = Math.ceil((eta.getTime() - now.getTime()) / (1000 * 60 * 60 * 24));
  return diff;
}

function getETADate(item) {
  const ev = getLatestEvent(item.result);
  if (!ev) return null;
  const content = ev.content || ev.content_loc || ev.content_en || '';
  return extractEstimatedDate(content);
}

// ---- 今日判断 ----
function isToday(iso) {
  if (!iso) return false;
  const d = new Date(iso);
  const today = new Date();
  return d.getFullYear() === today.getFullYear() &&
         d.getMonth() === today.getMonth() &&
         d.getDate() === today.getDate();
}

// ---- 筛选 ----
let filterText = '';
let filterStatus = null; // null = 全部, or status string

document.getElementById('filterInput').addEventListener('input', function() {
  filterText = this.value.trim().toLowerCase();
  render();
});

function matchesFilter(no, item) {
  if (filterStatus && calcStatus(item.result) !== filterStatus) return false;
  if (!filterText) return true;
  if (no.toLowerCase().includes(filterText)) return true;
  if (item.note && item.note.toLowerCase().includes(filterText)) return true;
  if (item.salesperson && item.salesperson.toLowerCase().includes(filterText)) return true;
  if (item.supplier && item.supplier.toLowerCase().includes(filterText)) return true;
  if (item.supplierNo && item.supplierNo.toLowerCase().includes(filterText)) return true;
  if (item.warehouse && item.warehouse.toLowerCase().includes(filterText)) return true;
  if (item.groupName && item.groupName.toLowerCase().includes(filterText)) return true;
  const ev = getLatestEvent(item.result);
  if (ev) {
    const c = eventContent(ev).toLowerCase();
    if (c.includes(filterText)) return true;
  }
  return false;
}

// ---- 统计 ----
function renderStats(entries) {
  const counts = { arriving: 0, in_transit: 0, pending: 0, completed: 0, fail: 0 };
  for (const [, item] of entries) {
    const s = calcStatus(item.result);
    if (counts[s] !== undefined) counts[s]++;
  }
  const statuses = ['arriving', 'in_transit', 'pending', 'completed', 'fail'];
  const labels = {
    arriving: t('快到港', 'Arriving'),
    in_transit: t('运输中', 'In Transit'),
    pending: t('待更新', 'Pending'),
    completed: t('已完成', 'Done'),
    fail: t('失败', 'Failed'),
  };

  let html = `<span class="stat-pill all${filterStatus === null ? ' active' : ''}" onclick="setStatusFilter(null)">📊 ${t('全部', 'All')} <b>${entries.length}</b></span>`;
  for (const s of statuses) {
    if (counts[s] > 0 || filterStatus === s) {
      html += `<span class="stat-pill ${s}${filterStatus === s ? ' active' : ''}" onclick="setStatusFilter('${s}')">${labels[s]} <b>${counts[s]}</b></span>`;
      if (s === 'fail' && counts[s] > 0) {
        html += `<button style="padding:2px 8px;font-size:11px;border:1px solid #e0c0c0;border-radius:6px;background:#fff;cursor:pointer;color:#c62828;" onclick="event.stopPropagation();copyFailedNos()" title="复制所有失败单号">📋 复制单号</button>`;
      }
    }
  }
  document.getElementById('statsRow').innerHTML = html;
}

async function copyFailedNos() {
  const history = await getHistory();
  const failed = Object.entries(history)
    .filter(([, item]) => calcStatus(item.result) === 'fail')
    .map(([no]) => no);
  if (failed.length === 0) { showToast('没有失败的单号', true); return; }
  navigator.clipboard.writeText(failed.join('\n')).then(() => {
    showToast('✅ 已复制 ' + failed.length + ' 个单号');
  }).catch(() => showToast('复制失败', true));
}

function setStatusFilter(s) {
  filterStatus = s;
  document.getElementById('filterInput').value = '';
  filterText = '';
  render();
}

// ---- 排序：置顶优先 → 快到港 → 运输中 → 待更新 → 已完成 → 失败 ----
// 同状态内按预计到港日期升序（越近越前），无日期的排后面
const SORT_PRIORITY = { arriving: 0, in_transit: 1, pending: 2, completed: 3, fail: 4 };

function sortEntries(entries) {
  const pins = getPins();
  return entries.sort((a, b) => {
    // 置顶优先
    const pa = pins.includes(a[0]) ? 0 : 1;
    const pb = pins.includes(b[0]) ? 0 : 1;
    if (pa !== pb) return pa - pb;

    const sa = SORT_PRIORITY[calcStatus(a[1].result)] ?? 99;
    const sb = SORT_PRIORITY[calcStatus(b[1].result)] ?? 99;
    if (sa !== sb) return sa - sb;

    // 同状态：按预计到港日期升序（有日期的排前面）
    const da = getETADate(a[1]);
    const db = getETADate(b[1]);
    if (da && db) return da.getTime() - db.getTime();
    if (da && !db) return -1;
    if (!da && db) return 1;

    // 都没日期，按更新时间降序
    return (b[1].updatedAt || '').localeCompare(a[1].updatedAt || '');
  });
}

// ---- 渲染卡片 HTML ----

  const events = (item.result && item.result.dataDict && item.result.dataDict.list) || [];
  const briefText = latest ? eventContent(latest) : '';
  const days = getDaysRemaining(item);
  const transit = getTransitInfo(item);

  // 时效标签
  let transitHTML = '';
  if (transit) {
    if (transit.isCompleted) {
      transitHTML = `<span class="transit-tag done" title="${t('最早轨迹→签收', 'First event→Signed')}">✅ ${t('全程', 'Total')} ${transit.totalDays}${t('天', 'd')}<span class="transit-range">${transit.startStr}→${transit.endStr}</span></span>`;
    } else {
      transitHTML = `<span class="transit-tag active" title="${t('最早轨迹至今', 'First event→Today')}">⏳ ${t('已运输', 'In transit')} ${transit.totalDays}${t('天', 'd')}<span class="transit-range">${transit.startStr}→</span></span>`;
    }
  }

  // 快到港高亮 class
  let cardExtraClass = '';

    if (days !== null && days >= 0 && days <= 1) {
      cardExtraClass = 'urgent';
      daysHTML = `<span class="days-left urgent">${t('还有' + days + '天到港', days + 'd to port')}</span>`;
    } else if (days !== null && days >= 2 && days <= 3) {
      cardExtraClass = 'warning';
      daysHTML = `<span class="days-left warning">${t('还有' + days + '天到港', days + 'd to port')}</span>`;
    }
  }

  const updateLabel = t('更新', 'Updated');

  return `
    <div class="card${isPinned(no) ? ' pinned' : ''} ${cardExtraClass}" data-no="${no.replace(/"/g, '&quot;')}">
      <div class="card-header" onclick="toggleCard(this)">
        <div class="card-header-row main">
          <span class="no">${escHtml(no)}</span>
          <span class="card-note${item.note ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="note" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加客户名', 'Click to add customer')}">${item.note ? escHtml(item.note) : (currentLang === 'zh' ? '+ 客户' : '+ Customer')}</span>
          <span class="card-sp${item.salesperson ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="salesperson" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加业务员', 'Click to add salesperson')}">${item.salesperson ? escHtml(item.salesperson) : (currentLang === 'zh' ? '+ 业务' : '+ Sales')}</span>
          <span class="card-supplier${item.supplier ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="supplier" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加上家配合商', 'Click to add supplier')}">${item.supplier ? escHtml(item.supplier) : (currentLang === 'zh' ? '+ 配合商' : '+ Supplier')}</span>
          <span class="card-warehouse${item.warehouse ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="warehouse" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加仓库', 'Click to add warehouse')}">${item.warehouse ? escHtml(item.warehouse) : (currentLang === 'zh' ? '+ 仓库' : '+ WH')}</span>
          <span class="card-group${item.groupName ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="groupName" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加群名', 'Click to add group')}">${item.groupName ? escHtml(item.groupName) : (currentLang === 'zh' ? '+ 群名' : '+ Group')}</span>
          <span class="status-tag ${status}">${statusLabel(status, currentLang)}</span>
          <span style="flex:1;"></span>
          <span class="card-actions" onclick="event.stopPropagation();">

          </span>

        </div>
        <div class="card-header-row sub">
          <span class="card-supplier-no${item.supplierNo ? '' : ' empty'}" data-no="${escHtml(no)}" data-field="supplierNo" onclick="event.stopPropagation();startEditField(this)" title="${t('点击添加上家单号', 'Click to add supplier No')}">${item.supplierNo ? escHtml(item.supplierNo) : (currentLang === 'zh' ? '+ 上家单号' : '+ Sup No')}</span>

function render() {
  getHistory().then(history => {
    const allEntries = sortEntries(Object.entries(history));
    const filteredAll = allEntries.filter(([no, item]) => matchesFilter(no, item));
    const todayEntries = filteredAll.filter(([, item]) => isToday(item.updatedAt));

    // 控制栏
    const controlBar = document.getElementById('controlBar');
    controlBar.style.display = allEntries.length > 0 ? 'flex' : 'none';
    renderStats(filteredAll);
    updatePinBadge();

    // ---- 左侧：全部历史 ----
    if (filteredAll.length === 0) {
      emptyAll.style.display = 'block';
      listAll.innerHTML = '';
      emptyAll.textContent = filterStatus || filterText ? t('没有匹配的记录', 'No matching records') : t('暂无跟踪记录，输入运单号开始查询', 'No records yet. Enter a waybill to start.');
    } else {
      emptyAll.style.display = 'none';
      let html = '';
      for (const [no, item] of filteredAll) {
        html += renderCardHTML(no, item);
      }
      listAll.innerHTML = html;
    }
    countAll.textContent = filteredAll.length;

    // ---- 右侧：今日查询 ----
    if (todayEntries.length === 0) {
      emptyToday.style.display = 'block';
      listToday.innerHTML = '';
      emptyToday.textContent = filterStatus || filterText ? t('没有匹配的记录', 'No matching records') : t('今天还没有查询记录', 'No queries today yet');
    } else {
      emptyToday.style.display = 'none';
      let html = '';
      for (const [no, item] of todayEntries) {
        html += renderCardHTML(no, item);
      }
      listToday.innerHTML = html;
    }
    countToday.textContent = todayEntries.length;

  }).catch(() => showToast(t('加载历史失败', 'Failed to load history'), true));
}

// ---- 操作 ----
async function doSearch(no) {
  no = no.trim();
  if (!no) { showToast(t('请输入运单号', 'Please enter a waybill number'), true); return; }
  btnSearch.disabled = true;
  btnSearch.textContent = t('查询中...', 'Tracking...');
  try {
    const result = await trackQuery(no);
    if (result.result === false) {
      showToast(result.info || t('查询失败', 'Query failed'), true);
    } else {
      showToast(t('✅ 查询成功', '✅ Success'));
    }
    render();
    // 查询成功后高亮左侧同名卡片
    setTimeout(() => highlightInLeft(no), 100);
  } catch { showToast(t('网络错误', 'Network error'), true); }
  btnSearch.disabled = false;
  btnSearch.textContent = t('查询', 'Track');
  inputNo.value = '';
  inputNo.focus();
}

async function refreshOne(no, btn) {
  btn.disabled = true;
  btn.textContent = '...';
  try {
    const result = await trackQuery(no);
    if (result.result === false) showToast(result.info || t('刷新失败', 'Refresh failed'), true);
    else showToast(t('✅ 已刷新', '✅ Refreshed'));
    render();
  } catch { showToast(t('刷新失败', 'Refresh failed'), true); render(); }
}

function editSectionTitle(el) {
  const id = el.getAttribute('data-section-id');
  const current = el.textContent;
  const input = document.createElement('input');
  input.className = 'title-edit-input';
  input.value = current;
  input.onblur = () => {
    const val = input.value.trim() || current;
    el.textContent = val;
    const titles = getSectionTitles();
    titles[id] = val;
    localStorage.setItem('section_titles', JSON.stringify(titles));
    input.replaceWith(el);
  };

    if (e.key === 'Enter') input.blur();
    if (e.key === 'Escape') { el.textContent = current; input.replaceWith(el); }
  };
  el.replaceWith(input);
  input.focus();
  input.select();
}

function getMemoItems() {
  try {
    const arr = JSON.parse(localStorage.getItem('tracking_memo_items'));
    if (Array.isArray(arr) && arr.length > 0) return arr;
  } catch {}
  return ['', '', '', '', '', '']; // 默认 6 行
}
function saveMemoItems(arr) {
  // 去掉尾部连续空行
  while (arr.length > 1 && !arr[arr.length - 1].trim()) arr.pop();
  localStorage.setItem('tracking_memo_items', JSON.stringify(arr));
}

function renderMemo() {
  const list = document.getElementById('memoList');
  if (!list) return;
  const items = getMemoItems();
  // 确保至少有 5 行
  while (items.length < 5) items.push('');

  list.innerHTML = items.map((text, i) => `
    <li class="memo-row">
      <span class="memo-num">${i + 1}.</span>
      <input class="memo-input" data-index="${i}" value="${escHtml(text)}" placeholder="...">
      <button class="memo-del" data-index="${i}" title="${t('清空此行', 'Clear')}">✕</button>
    </li>
  `).join('');

  // 绑定事件
  list.querySelectorAll('.memo-input').forEach(inp => {
    inp.addEventListener('input', debounceSaveMemo);
    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const idx = parseInt(inp.dataset.index);
        const items = getMemoItems();
        // 在下一行插入空项
        items.splice(idx + 1, 0, '');
        saveMemoItems(items);
        renderMemo();
        // 聚焦新行
        setTimeout(() => {
          const next = document.querySelector(`.memo-input[data-index="${idx + 1}"]`);
          if (next) next.focus();
        }, 50);
      }
      if (e.key === 'Backspace' && !inp.value) {
        const idx = parseInt(inp.dataset.index);
        const items = getMemoItems();
        if (items.length > 1) {
          items.splice(idx, 1);
          saveMemoItems(items);
          renderMemo();
          setTimeout(() => {
            const prev = document.querySelector(`.memo-input[data-index="${Math.max(0, idx - 1)}"]`);
            if (prev) prev.focus();
          }, 50);
        }
      }
    });
  });

  list.querySelectorAll('.memo-del').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.index);
      const items = getMemoItems();
      items[idx] = '';
      saveMemoItems(items);
      renderMemo();
    });
  });
}

let memoSaveTimer;
function debounceSaveMemo() {
  clearTimeout(memoSaveTimer);
  memoSaveTimer = setTimeout(() => {
    const inputs = document.querySelectorAll('.memo-input');
    const items = getMemoItems();
    inputs.forEach(inp => {
      const idx = parseInt(inp.dataset.index);
      items[idx] = inp.value;
    });
    saveMemoItems(items);
    const saved = document.getElementById('memoSaved');
    if (saved) {
      saved.textContent = t('已自动保存', 'Auto saved') + ' ' + new Date().toLocaleTimeString('zh-CN', {hour:'2-digit',minute:'2-digit'});
    }
    // 尾部空行过多时重新渲染以清理
    let lastNonEmpty = items.length - 1;
    while (lastNonEmpty >= 0 && !items[lastNonEmpty].trim()) lastNonEmpty--;
    const emptyTrail = items.length - 1 - lastNonEmpty;
    if (emptyTrail > 3) renderMemo();
  }, 600);
}

function exportCSV() {
  getHistory().then(history => {
    const entries = sortEntries(Object.entries(history));
    const filtered = entries.filter(([no, item]) => matchesFilter(no, item));
    if (filtered.length === 0) {
      showToast(t('没有可导出的数据', 'No data to export'), true);
      return;
    }

    const h = t;
    const header = ['运单号', '状态', '客户', '业务员', '配合商', '仓库', '群名', '上家单号', '时效(天)', '最新轨迹', '更新时间', '剩余天数'];
    const rows = [header.map(c => '"' + c + '"').join(',')];

    for (const [no, item] of filtered) {
      const status = statusLabel(calcStatus(item.result), currentLang);
      const note = item.note || '';
      const sp = item.salesperson || '';
      const supplier = item.supplier || '';
      const supplierNo = item.supplierNo || '';
      const warehouse = item.warehouse || '';
      const groupName = item.groupName || '';
      const latest = getLatestEvent(item.result);
      const brief = latest ? eventContent(latest).replace(/"/g, '""') : '';
      const time = formatTime(item.updatedAt) || '';
      const daysLeft = getDaysRemaining(item);
      const daysLeftStr = daysLeft !== null && daysLeft >= 0 ? daysLeft + t('天', 'd') : '';
      const transitDays = getTransitInfo(item);
      const transitStr = transitDays ? transitDays.totalDays + t('天', 'd') : '';

      rows.push([
        '"' + no + '"',
        '"' + status + '"',
        '"' + note + '"',
        '"' + sp + '"',
        '"' + supplier + '"',
        '"' + warehouse + '"',
        '"' + groupName + '"',
        '"' + supplierNo + '"',
        '"' + transitStr + '"',
        '"' + brief + '"',
        '"' + time + '"',
        '"' + daysLeftStr + '"',
      ].join(','));
    }

    // BOM for Excel UTF-8
    const BOM = '﻿';
    const csv = BOM + rows.join('\n');
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const today = new Date();
    const dateStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
    a.href = url;
    a.download = `货物跟踪_${dateStr}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast(t('✅ 导出成功', '✅ Exported'));
  });
}

function getEmptyLabel(field) {

function startEditField(el) {
  const no = el.getAttribute('data-no');
  const field = el.getAttribute('data-field');
  const cfg = FIELD_CONFIG[field];
  const currentText = el.textContent === cfg.zh_empty || el.textContent === cfg.en_empty ? '' : el.textContent;

  // 从全部历史记录中收集该字段的已有值（不看当前单号）
  const existingValues = new Set();
  getHistory().then(history => {
    Object.values(history).forEach(item => {
      const v = item[field];
      if (v && v.trim() && v.trim() !== currentText) existingValues.add(v.trim());
    });
    // 追加到 datalist
    const listEl = document.getElementById(listId);
    if (listEl) {
      existingValues.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v;
        listEl.appendChild(opt);
      });
    }
  });

  const listId = 'dl_' + field;
  // 确保页面有持久 datalist
  let listEl = document.getElementById(listId);
  if (!listEl) {
    listEl = document.createElement('datalist');
    listEl.id = listId;
    document.body.appendChild(listEl);
  }

  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'card-note-input';
  input.setAttribute('list', listId);
  input.value = currentText;
  input.placeholder = t(cfg.zh_placeholder, cfg.en_placeholder);
  input.setAttribute('data-no', no);
  input.setAttribute('data-field', field);

  input.addEventListener('blur', () => saveField(input, el));
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); saveField(input, el); }
    if (e.key === 'Escape') { cancelEditField(input, el); }
  });

  el.replaceWith(input);
  input.focus();
  input.select();
}

function cancelEditField(input, el) {
  const field = input.getAttribute('data-field');
  const emptyLabel = getEmptyLabel(field);
  el.innerHTML = emptyLabel;
  el.classList.add('empty');
  input.replaceWith(el);
}

async function saveField(input, el) {
  const value = input.value.trim();
  const no = input.getAttribute('data-no');
  const field = input.getAttribute('data-field');
  const cfg = FIELD_CONFIG[field];
  const emptyLabel = getEmptyLabel(field);
  const selector = cfg.selector;

  // 重建 span
  const span = el.cloneNode(true);
  span.textContent = value || emptyLabel;
  if (!value) span.classList.add('empty');
  else span.classList.remove('empty');
  span.onclick = function(e) { e.stopPropagation(); startEditField(this); };
  // 追加到持久 datalist
  if (value) {
    const dl = document.getElementById('dl_' + field);
    if (dl && !dl.querySelector('option[value="' + value.replace(/"/g, '&quot;') + '"]')) {
      const opt = document.createElement('option');
      opt.value = value;
      dl.appendChild(opt);
    }
  }

  input.replaceWith(span);

  // 保存到后端
  try {
    const body = {};
    body[field] = value;
    await fetch(`/api/note/${encodeURIComponent(no)}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    // 同步更新两边面板的同名单号同字段
    document.querySelectorAll(`${selector}[data-no="${no.replace(/"/g, '&quot;')}"]`).forEach(other => {
      if (other !== span) {
        other.textContent = value || emptyLabel;
        if (!value) other.classList.add('empty');
        else other.classList.remove('empty');
      }
    });
  } catch { showToast(t('保存失败', 'Save failed'), true); }
}

async function refreshActive() {
  btnRefreshActive.disabled = true;
  btnRefreshActive.textContent = t('刷新中...', 'Refreshing...');
  try {
    const history = await getHistory();
    const entries = Object.entries(history);
    // 筛选出进行中的单号：非 completed 且非 fail
    const activeEntries = entries.filter(([, item]) => {
      const s = calcStatus(item.result);
      return s !== 'completed' && s !== 'fail';
    });

    if (activeEntries.length === 0) {
      showToast(t('没有需要刷新的单号', 'No active shipments to refresh'));
      btnRefreshActive.disabled = false;
      btnRefreshActive.textContent = t('🔄 刷新进行中', '🔄 Refresh Active');
      return;
    }

    let done = 0, failed = 0;
    for (const [no] of activeEntries) {
      try {
        const result = await trackQuery(no);
        if (result.result === false) failed++;
      } catch { failed++; }
      done++;
    }

    if (failed === 0) {
      showToast(t(`✅ ${done} 票全部刷新成功`, `✅ ${done} refreshed`));
    } else {
      showToast(t(`✅ ${done} 票完成，${failed} 票失败`, `✅ ${done} done, ${failed} failed`), !!failed);
    }
    render();
  } catch { showToast(t('刷新失败', 'Refresh failed'), true); render(); }
  btnRefreshActive.disabled = false;
  btnRefreshActive.textContent = t('🔄 刷新进行中', '🔄 Refresh Active');
}

// ---- 拖拽调节宽度 ----
(function initResizers() {
  function makeResizable(resizer, leftEl, rightEl, storageKey, minLeft, minRight) {
    if (!resizer || !leftEl || !rightEl) return;

    // 恢复保存的宽度
    const saved = localStorage.getItem(storageKey);
    if (saved) {
      const w = parseInt(saved);
      if (w > 0) {
        leftEl.style.width = w + 'px';
        leftEl.style.flex = 'none';
        rightEl.style.flex = '1 1 0%';
      }
    }

    let dragging = false, startX, startW;

    resizer.addEventListener('mousedown', function(e) {
      e.preventDefault();
      dragging = true;
      startX = e.clientX;
      startW = leftEl.getBoundingClientRect().width;
      resizer.classList.add('active');
      document.body.style.cursor = 'col-resize';
      document.body.style.userSelect = 'none';
    });

    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      const dx = e.clientX - startX;
      let newW = Math.max(minLeft, Math.min(startW + dx, window.innerWidth - minRight));
      leftEl.style.width = newW + 'px';
      leftEl.style.flex = 'none';
      rightEl.style.flex = '1 1 0%';
    });

    document.addEventListener('mouseup', function() {
      if (!dragging) return;
      dragging = false;
      resizer.classList.remove('active');
      document.body.style.cursor = '';
      document.body.style.userSelect = '';
      // 保存
      localStorage.setItem(storageKey, Math.round(leftEl.getBoundingClientRect().width));
    });
  }

  makeResizable(
    document.getElementById('resizerSidebar'),
    document.getElementById('sidebar'),
    document.getElementById('contentArea'),
    'resizer_sidebar_w', 150, 400
  );
  makeResizable(
    document.getElementById('resizerPanels'),
    document.getElementById('panelAll'),
    document.getElementById('panelToday'),
    'resizer_panel_w', 250, 250
  );
  // 右边分隔条：今日查询 ↔ 预留区
  makeResizable(
    document.getElementById('resizerRight'),
    document.getElementById('panelToday'),
    document.getElementById('panelRight'),
    'resizer_right_w', 200, 0
  );
})();

    if (savedW) {
      panel.style.width = savedW + 'px';
      panel.style.flex = 'none';
      panelAll.style.flex = '1 1 0%';

  } else {

    resizerP.style.display = 'none';

    panelAll.style.cssText = 'flex:1 1 0%;';

  localStorage.setItem('today_collapsed', panel.classList.contains('today-collapsed'));
}

// ---- 偏远查询 ----
async function doRemoteCheck() {
  const carrier = document.getElementById('remoteCarrier').value;
  const countryEl = document.getElementById('remoteCountry');
  const countryVal = countryEl.value; // format: "US|US - 美国(United States)"
  const post_city = document.getElementById('remotePostcode').value.trim();
  const resultEl = document.getElementById('remoteResult');
  const btn = document.getElementById('btnRemoteCheck');

  const parts = countryVal.split('|');
  const country = parts[0];
  const country_zw = parts[1] || countryVal;

  if (!country) { showToast('请选择国家', true); return; }
  if (!post_city) { showToast('请输入邮编或城市', true); return; }

  const carriers = carrier === 'all' ? ['DHL','UPS','fedex','TNT'] : [carrier];

  btn.disabled = true;
  btn.textContent = carrier === 'all' ? '查询4家快递商...' : '查询中...';
  resultEl.style.display = 'none';

  try {
    let allResults = [];
    for (const c of carriers) {
      const res = await fetch('/api/remote-check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: `country=${encodeURIComponent(country)}&country_zw=${encodeURIComponent(country_zw)}&post_city=${encodeURIComponent(post_city)}&express_company=${encodeURIComponent(c)}`,
      });
      const ret = await res.json();
      if (ret.code == 1 && ret.data && ret.data.length > 0) {
        allResults = allResults.concat(ret.data);
      }
    }

    resultEl.style.display = 'block';
    if (allResults.length > 0) {
      const farItems = allResults.filter(d => d.is_far == 1);
      const notFarItems = allResults.filter(d => d.is_far == 0);
      let html = '';
      if (farItems.length > 0) {
        html += '<div style=\"color:#c62828;margin-bottom:4px;\">🔴 偏远：' + farItems.map(d => d.range_express_company).join(', ') + '</div>';
      }
      if (notFarItems.length > 0) {
        html += '<div style=\"color:#2e7d32;\">✅ 非偏远：' + notFarItems.map(d => d.range_express_company).join(', ') + '</div>';
      }
      resultEl.className = 'remote-result ' + (farItems.length > 0 ? 'far' : 'not-far');
      resultEl.innerHTML = html;
    } else {
      resultEl.className = 'remote-result error';
      resultEl.textContent = '查询失败，请重试';
    }
  } catch {
    resultEl.style.display = 'block';
    resultEl.className = 'remote-result error';
    resultEl.textContent = '网络错误，请重试';
  }
  btn.disabled = false;
  btn.textContent = '查询是否偏远';
}

// 偏远查询回车快捷键
document.getElementById('remotePostcode').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doRemoteCheck();
});


// ---- 仓库速查 ----
function getWarehouses() {
  try { return JSON.parse(localStorage.getItem('warehouse_list')) || []; }
  catch { return []; }
}
function saveWarehouses(arr) { localStorage.setItem('warehouse_list', JSON.stringify(arr)); }

function renderWarehouses() {
  const filter = (document.getElementById('whSearch').value || '').trim().toLowerCase();
  const list = document.getElementById('whList');
  if (!list) return;
  const items = getWarehouses();
  const filtered = filter ? items.filter(w => w.supplier.toLowerCase().includes(filter)) : items;

  if (filtered.length === 0) {
    list.innerHTML = '<div style="font-size:12px;color:#b0bcc8;text-align:center;padding:12px 0;">' + (filter ? '没有匹配的仓库' : '暂无仓库，点击下方添加') + '</div>';
    return;
  }
  list.innerHTML = filtered.map((w, i) => {
    const origIdx = items.indexOf(w);
    return `<div style="background:#fafbfc;border:1px solid #e8ecf2;border-radius:8px;padding:8px 10px;margin-bottom:6px;font-size:12px;">
      <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
        <span style="font-weight:600;color:#6a5acd;flex:1;">🏭 ${escHtml(w.name)}</span>
        <span style="font-size:11px;color:#9aabb8;">${escHtml(w.supplier)}</span>
        <button style="padding:2px 6px;font-size:10px;border:none;background:transparent;cursor:pointer;color:#9aabb8;" onclick="copyWarehouse(${origIdx})" title="一键复制仓库信息">📋</button>
        <button style="padding:2px 6px;font-size:10px;border:none;background:transparent;cursor:pointer;color:#9aabb8;" onclick="editWarehouse(${origIdx})" title="编辑">✎</button>
        <button style="padding:2px 6px;font-size:10px;border:none;background:transparent;cursor:pointer;color:#e0c0c0;" onclick="deleteWarehouse(${origIdx})" title="删除">✕</button>
      </div>
      ${w.address ? '<div style="font-size:11px;color:#6b7a90;">📍 ' + escHtml(w.address) + '</div>' : ''}
      ${w.phone ? '<div style="font-size:11px;color:#6b7a90;">📞 ' + escHtml(w.phone) + '</div>' : ''}
    </div>`;
  }).join('');
}

function addWarehouse() {
  const name = prompt('仓库名称（如：深圳龙华仓）：');
  if (!name || !name.trim()) return;
  const supplier = prompt('配合商（如：海连）：');
  if (!supplier || !supplier.trim()) return;
  const address = prompt('地址（可选）：') || '';
  const phone = prompt('电话（可选）：') || '';
  const items = getWarehouses();
  items.push({ name: name.trim(), supplier: supplier.trim(), address: address.trim(), phone: phone.trim() });
  saveWarehouses(items);
  renderWarehouses();
}

function editWarehouse(i) {
  const items = getWarehouses();
  const w = items[i];
  const name = prompt('仓库名称：', w.name);
  if (name === null) return;
  if (!name.trim()) { deleteWarehouse(i); return; }
  const supplier = prompt('配合商：', w.supplier);
  if (supplier === null) return;
  if (!supplier.trim()) { deleteWarehouse(i); return; }
  const address = prompt('地址（可选）：', w.address || '') || '';
  const phone = prompt('电话（可选）：', w.phone || '') || '';
  items[i] = { name: name.trim(), supplier: supplier.trim(), address: address.trim(), phone: phone.trim() };
  saveWarehouses(items);
  renderWarehouses();
}

function deleteWarehouse(i) {
  const items = getWarehouses();
  items.splice(i, 1);
  saveWarehouses(items);
  renderWarehouses();
}

function copyWarehouse(i) {
  const w = getWarehouses()[i];
  if (!w) return;
  const text = [w.address, w.phone, '', '师傅，如果需要拍照回传平台，麻烦不要拍到招牌或者抬头，拍货就可以，感谢感谢'].filter(Boolean).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ 已复制：' + w.name);
  }).catch(() => showToast('复制失败', true));
}

renderWarehouses();

// ---- 常用名单管理 ----
const ROSTER_KEYS = { note: 'roster_note', salesperson: 'roster_salesperson', supplier: 'roster_supplier', warehouse: 'roster_warehouse', groupName: 'roster_groupName' };

function getRoster(field) {
  try { return JSON.parse(localStorage.getItem(ROSTER_KEYS[field])) || []; }
  catch { return []; }
}
function saveRoster(field, arr) { localStorage.setItem(ROSTER_KEYS[field], JSON.stringify(arr)); }

// 核心：刷新某个字段的 datalist
function refreshDatalist(field) {
  let dl = document.getElementById('dl_' + field);
  if (!dl) {
    dl = document.createElement('datalist');
    dl.id = 'dl_' + field;
    document.body.appendChild(dl);
  }
  dl.innerHTML = '';
  const seen = new Set();
  // 先加载名单
  getRoster(field).forEach(v => {
    if (!seen.has(v)) {
      seen.add(v);
      const opt = document.createElement('option');
      opt.value = v;
      dl.appendChild(opt);
    }
  });
  // 再从当前 DOM 上的卡片中收集已有值
  const cfg = FIELD_CONFIG[field];
  document.querySelectorAll(cfg.selector).forEach(el => {
    const t = el.textContent.trim();
    if (t && !t.startsWith('+') && !seen.has(t)) {
      seen.add(t);
      const opt = document.createElement('option');
      opt.value = t;
      dl.appendChild(opt);
    }
  });
}

function renderRosters() {
  const idMap = { note: 'rosterNote', salesperson: 'rosterSalesperson', supplier: 'rosterSupplier', warehouse: 'rosterWarehouse', groupName: 'rosterGroupName' };
  ['note', 'salesperson', 'supplier', 'warehouse', 'groupName'].forEach(field => {
    const container = document.getElementById(idMap[field]);
    if (!container) return;
    const items = getRoster(field);
    container.innerHTML = items.map((text, i) => `
      <div class="template-item" style="display:flex;align-items:center;gap:4px;margin-bottom:3px;border:1px solid #e8ecf2;border-radius:6px;overflow:hidden;">
        <span style="flex:1;padding:5px 8px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#4a5a70;">${escHtml(text)}</span>
        <button style="padding:3px 6px;font-size:10px;border:none;background:transparent;cursor:pointer;color:#9aabb8;" onclick="editRosterItem('${field}',${i})" title="编辑">✎</button>
        <button style="padding:3px 6px;font-size:10px;border:none;background:transparent;cursor:pointer;color:#e0c0c0;" onclick="deleteRosterItem('${field}',${i})" title="删除">✕</button>
      </div>
    `).join('');
    refreshDatalist(field);
  });
}

function addRosterItem(field) {
  const text = prompt('输入名称：');
  if (!text || !text.trim()) return;
  const items = getRoster(field);
  items.push(text.trim());
  saveRoster(field, items);
  renderRosters();
}

function editRosterItem(field, i) {
  const items = getRoster(field);
  const text = prompt('编辑名称：', items[i]);
  if (text === null) return;
  if (!text.trim()) { deleteRosterItem(field, i); return; }
  items[i] = text.trim();
  saveRoster(field, items);
  renderRosters();
}

function deleteRosterItem(field, i) {
  const items = getRoster(field);
  items.splice(i, 1);
  saveRoster(field, items);
  renderRosters();
}

// 初始化
renderRosters();
// render 完成后再次刷新 datalist
setTimeout(() => { ['note','salesperson','supplier','warehouse','groupName'].forEach(refreshDatalist); }, 500);

// ---- 日报 ----
async function generateDailyReport() {
  const history = await getHistory();
  const entries = Object.entries(history);

  // 按群名分组
  const groups = {};
  for (const [no, item] of entries) {
    const gn = item.groupName || '未分组';
    if (!groups[gn]) groups[gn] = [];
    const status = calcStatus(item.result);
    const label = statusLabel(status, currentLang);
    const note = item.note || '';
    groups[gn].push({ no, status, label, note });
  }

  const today = new Date();
  const dateStr = `${today.getMonth()+1}/${today.getDate()}`;

  let html = '';
  let plainText = '';

  for (const [groupName, shipments] of Object.entries(groups)) {
    const arriving = shipments.filter(s => s.status === 'arriving');
    const inTransit = shipments.filter(s => s.status === 'in_transit');
    const completed = shipments.filter(s => s.status === 'completed');

    // 跳过分组如果没有任何进行中的
    if (!arriving.length && !inTransit.length && !completed.length) continue;

    html += `<div style="margin-bottom:16px;">`;
    html += `<div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#1e293b;">💬 ${escHtml(groupName)}</div>`;
    html += `<div style="font-size:12px;color:#8896a6;margin-bottom:4px;">📦 货物日报 ${dateStr}</div>`;
    html += `<div style="color:#c0c8d4;margin-bottom:4px;">━━━━━━━━━━━━</div>`;

    plainText += `💬 ${groupName}\n📦 货物日报 ${dateStr}\n━━━━━━━━━━━━\n`;

    if (arriving.length) {
      const items = arriving.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、');
      html += `<div style="margin-bottom:3px;">🔴 <b>快到港：</b>${escHtml(items)}</div>`;
      plainText += `🔴 快到港：${arriving.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、')}\n`;
    }
    if (inTransit.length) {
      const items = inTransit.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、');
      html += `<div style="margin-bottom:3px;">🟡 <b>运输中：</b>${escHtml(items)}</div>`;
      plainText += `🟡 运输中：${inTransit.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、')}\n`;
    }
    if (completed.length) {
      const items = completed.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、');
      html += `<div style="margin-bottom:3px;">✅ <b>已签收：</b>${escHtml(items)}</div>`;
      plainText += `✅ 已签收：${completed.map(s => s.no + (s.note ? ' ' + s.note : '')).join('、')}\n`;
    }
    html += `</div>`;
    plainText += '\n';
  }

  if (!html) {
    html = '<div style="color:#8896a6;text-align:center;padding:20px 0;">暂无进行中的单号</div>';
    plainText = '暂无进行中的单号';
  }

  document.getElementById('dailyReportBody').innerHTML = html;
  document.getElementById('dailyReportBody').setAttribute('data-plain-text', plainText);
  showToast('✅ 日报已生成');
}

async function copyDailyReport() {
  let text = document.getElementById('dailyReportBody').getAttribute('data-plain-text');
  if (!text) {
    await generateDailyReport();
    text = document.getElementById('dailyReportBody').getAttribute('data-plain-text');
  }
  navigator.clipboard.writeText(text).then(() => {
    showToast('✅ 日报已复制');
  }).catch(() => showToast('复制失败', true));
}
